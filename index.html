<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Для тебя ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #ff758c, #ff7eb3);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .heart {
      width: 90px;
      height: 90px;
      background: #ff2e63;
      position: relative;
      transform: rotate(-45deg);
      animation: pulse 1.2s infinite;
      cursor: pointer;
      z-index: 2;
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 90px;
      height: 90px;
      background: #ff2e63;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before {
      top: -45px;
      left: 0;
    }

    .heart::after {
      left: 45px;
      top: 0;
    }

    @keyframes pulse {
      0% { transform: rotate(-45deg) scale(1); }
      50% { transform: rotate(-45deg) scale(1.2); }
      100% { transform: rotate(-45deg) scale(1); }
    }

    .message {
      position: absolute;
      max-width: 90%;
      font-size: 22px;
      line-height: 1.4;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 2;
    }

    .message.show {
      opacity: 1;
    }

    .typing {
      border-right: 2px solid white;
      white-space: nowrap;
      overflow: hidden;
      display: inline-block;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .floating-heart {
      position: absolute;
      color: rgba(255,255,255,0.7);
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      20% { opacity: 1; }
      to {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    .hint {
      position: absolute;
      bottom: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="heart" onclick="startLove()"></div>

  <div id="msg" class="message">
    <div id="text" class="typing"></div>
  </div>

  <div class="hint">нажми на сердечко 💘</div>

  <script>
    const fullText = "Я тебя люблю... 💖\nТы — тот человек, рядом с которым мне спокойно.\nС тобой тепло. С тобой по-настоящему.\nИ я очень хочу, чтобы это было надолго...";

    function startLove() {
      document.getElementById('msg').classList.add('show');
      document.querySelector('.hint').style.display = 'none';

      typeText();

      for (let i = 0; i < 30; i++) {
        createHeart();
      }
    }

    function typeText() {
      const el = document.getElementById('text');
      let i = 0;

      function typing() {
        if (i < fullText.length) {
          if (fullText[i] === "\n") {
            el.innerHTML += "<br>";
          } else {
            el.innerHTML += fullText[i];
          }
          i++;
          setTimeout(typing, 40);
        } else {
          el.classList.remove('typing');
        }
      }

      typing();
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('floating-heart');
      heart.innerHTML = '❤';

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (12 + Math.random() * 20) + 'px';
      heart.style.animationDuration = (4 + Math.random() * 4) + 's';

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 8000);
    }
  </script>

</body>
</html>
